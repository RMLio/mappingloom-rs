[package]
name = "translator"
version.workspace = true
authors.workspace = true
edition.workspace = true

[dependencies]
algemaploom-plan = { path = "../algemaploom-plan/" }
optimizer = { path = "../optimizer/" }
plan = { path = "../plan/" }
translator_api = { path = "../translator_api/" }
translator_kgc = { path = "../translator_kgc/" }
translator_rml = { path = "../translator_rml/" }
translator_new_rml = { path = "../translator_new_rml/" }
translator_shexml = { path = "../translator_shexml/" }

log.workspace = true
oxiri = "0.2.11"
oxttl = "0.2.3"
serde.workspace = true
serde_json.workspace = true

jni = { version = "0.22.4", optional = true }
neon = { version = "1.1.1", optional = true }
pyo3 = { version = "0.28.3", features = ["extension-module"], optional = true }

[lib]
name = "translator"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]
