stages:
  - lint
  - build
  - test
  - deploy

include:
  # Make sure the CHANGELOG is always updated
  - project: 'rml/util/ci-templates'
    ref: main
    file: 'CHANGELOG.gitlab-ci.yml'

# The toolchains of the Java binding's native libraries (build_native.sh):
# MinGW for Windows, which every job that builds the Java binding references,
# and zig with cargo-zigbuild for macOS, which only the jobs whose jar ships
# reference; the others set NATIVE_APPLE to false.
.native-targets:
  script:
    - apt-get install -y gcc-mingw-w64
    - rustup target add x86_64-unknown-linux-gnu x86_64-pc-windows-gnu

.apple-targets:
  script:
    - apt-get install -y python3-pip
    - pip3 install --break-system-packages cargo-zigbuild ziglang
    - rustup target add x86_64-apple-darwin aarch64-apple-darwin

# Unittests
test-rust:
  image: rust:latest
  stage: test
  script:
    - cargo test --verbose --jobs 1 --workspace

test-java:
  image: rust:latest
  stage: test
  variables:
    NATIVE_APPLE: "false"
  script:
    - apt-get update
    - apt-get install -y default-jdk maven
    - !reference [.native-targets, script]
    - ./test_java.sh

# The kg-construct conformance suites, run by MappingWeaver with this
# translator (HANDBOOK: Conformance). Started by hand. MAPPINGWEAVER_REF picks
# the MappingWeaver branch or tag; MTR_VERSION, MTR_JOBS and the other variables
# of its conformance/run.sh apply as well.
conformance:
  image: rust:latest
  stage: test
  needs: []
  when: manual
  services:
    - name: docker:29-dind
      command: [ "--tls=false" ]
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    MAPPINGWEAVER_REF: development
    MTR_UNEXPECTED_PASS: warn
    MTR_CACHE: "$CI_PROJECT_DIR/.mtr-cache"
    NATIVE_APPLE: "false"
  cache:
    key: conformance
    paths:
      - .mtr-cache
  script:
    - apt-get update
    - apt-get install -y openjdk-21-jdk-headless maven
    - !reference [.native-targets, script]
    - ./build_java.sh
    - MAPPINGLOOM_VERSION=$(mvn -q -f crates/translator/src/java/algemaploom/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)
    - git clone --depth 1 --branch "$MAPPINGWEAVER_REF" https://github.com/RMLio/MappingWeaver-java.git mappingweaver
    - bash mappingweaver/conformance/run.sh -Dmappingloom.version=$MAPPINGLOOM_VERSION
  artifacts:
    when: always
    paths:
      - mappingweaver/target/conformance/report.json
      - mappingweaver/target/conformance/report.md
      - mappingweaver/target/conformance/mtr-run/*/*.log
    reports:
      junit: mappingweaver/target/conformance/junit.xml

# Builds
build-rust:
  image: rust:latest
  stage: build
  script:
    - cargo build

build-java:
  image: rust:latest
  stage: build
  script:
    - apt-get update
    - apt-get install -y default-jdk maven
    - !reference [.native-targets, script]
    - !reference [.apple-targets, script]
    - ./build_java.sh

build-python:
  image: rust:latest
  stage: build
  script:
    - ./build_python.sh

build-nodejs:
  image: rust:latest
  stage: build
  script:
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt update
    - apt-get install -y nodejs
    - ./build_nodejs.sh

###############################
#                             #
#     Automated Releases      #
#                             #
###############################
#
# (c) Dylan Van Assche (2022)
# IDLab - Ghent University - imec
#
# Create a Maven package and push it to Maven Central.
#
# CI variables: 
#    - GPG_SECRET_KEY: GPG secret key to sign Maven package as a file
#    - MAVEN_REPO_USER: Maven user for logging in
#    - MAVEN_REPO_PASSWORD: Maven password for logging in

Maven Central Deployment:
  stage: deploy
  image:
    name:  rust:latest
    pull_policy: if-not-present
  before_script:
    - apt-get update && apt-get install -y gpg ca-certificates default-jdk maven
    - !reference [.native-targets, script]
    - !reference [.apple-targets, script]
    - gpg --version
    - gpg --verbose --import --batch --yes $GPG_SECRET_KEY
  script:
    - cd ./crates/translator/src/java/algemaploom
    - mvn -s $CI_PROJECT_DIR/crates/translator/src/java/algemaploom/.m2/settings.xml --batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true clean deploy -P release -DskipTests=true
  allow_failure: true
  retry: 2
  only:
    - tags
